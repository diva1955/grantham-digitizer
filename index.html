<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>ഗ്രന്ഥശാലാ സ്റ്റോക്ക് ഡിജിറ്റൈസർ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

  <!-- Header -->
  <header class="bg-indigo-700 text-white px-4 py-3 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">സ്റ്റോക്ക് ഡിജിറ്റൈസർ</h1>
      <p class="text-xs text-indigo-200">Library Register Scanner</p>
    </div>
    <span id="rowCountBadge" class="bg-indigo-900 text-xs px-2.5 py-1 rounded-full font-semibold">0 വരികൾ</span>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <!-- Camera Section -->
    <div class="bg-white border-2 border-dashed border-indigo-300 rounded-xl p-4 text-center shadow-sm">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected(event)" />
      
      <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 shadow-sm transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="text-base">ഫോട്ടോ എടുക്കുക (Take Photo)</span>
      </button>
      <p class="text-xs text-slate-500 mt-2">രജിസ്റ്ററിന്റെ രണ്ട് പേജുകളും വ്യക്തമായി കാണുന്ന രീതിയിൽ പകർത്തുക</p>
    </div>

    <!-- Preview -->
    <div id="previewCard" class="hidden bg-white p-3 rounded-lg border border-slate-200 shadow-sm flex items-center space-x-3">
      <img id="imagePreview" src="" class="w-16 h-20 object-cover rounded border" />
      <div class="flex-1">
        <p id="previewText" class="text-xs text-slate-600 font-medium">ചിത്രം തയ്യാറാണ്</p>
        <button id="scanBtn" onclick="uploadAndScan()" class="mt-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
          ഡാറ്റ വേർതിരിക്കുക (Extract Rows)
        </button>
      </div>
    </div>

    <!-- Spinner -->
    <div id="loader" class="hidden text-center py-6">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
      <p id="loaderStatus" class="text-sm font-medium text-indigo-700 mt-2">അക്ഷരങ്ങൾ വായിക്കുന്നു... ദയവായി കാത്തിരിക്കുക.</p>
    </div>

    <!-- Table of Results -->
    <div id="resultsCard" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-800 text-base">പരിശോധിക്കുക (Review & Edit)</h2>
        <button onclick="addRow()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded font-medium">+ വരി ചേർക്കുക</button>
      </div>
      <div id="entriesList" class="space-y-3"></div>
    </div>
  </main>

  <!-- Sticky Export Bar -->
  <div id="footerBar" class="hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 flex justify-between items-center max-w-xl mx-auto shadow-lg z-20">
    <span id="totalItems" class="text-xs text-slate-600 font-medium">0 ഇനങ്ങൾ</span>
    <button onclick="downloadExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg flex items-center space-x-2 shadow">
      <span>എക്സൽ ഡൗൺലോഡ് (Excel)</span>
    </button>
  </div>

  <script>
    let preparedBlob = null;
    let extractedEntries = [];

    // Client-side auto-compression and orientation normalization
    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          // If phone captured portrait, rotate canvas to landscape for wide ledger
          let needsRotation = height > width;
          const maxDim = 2000;

          if (needsRotation) {
            // Swap dimensions for 90-degree turn
            let temp = width; width = height; height = temp;
          }

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');

          if (needsRotation) {
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((90 * Math.PI) / 180);
            ctx.drawImage(img, -height / 2, -width / 2, height, width);
          } else {
            ctx.drawImage(img, 0, 0, width, height);
          }

          canvas.toBlob(function(blob) {
            preparedBlob = blob;
            document.getElementById('imagePreview').src = URL.createObjectURL(blob);
            document.getElementById('previewCard').classList.remove('hidden');
          }, 'image/jpeg', 0.88);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function uploadAndScan() {
      if (!preparedBlob) return;

      const formData = new FormData();
      formData.append('file', preparedBlob, 'register.jpg');

      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('scanBtn').disabled = true;

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Server status ${response.status}: ${errText}`);
        }

        const result = await response.json();
        extractedEntries = result.entries || [];
        renderRows();
      } catch (err) {
        alert('സ്കാനിംഗ് തടസ്സപ്പെട്ടു: ' + err.message);
      } finally {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('scanBtn').disabled = false;
      }
    }

    function renderRows() {
      const container = document.getElementById('entriesList');
      container.innerHTML = '';

      extractedEntries.forEach((row, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2 text-sm';
        card.innerHTML = `
          <div class="flex justify-between items-center pb-1 border-b border-slate-100">
            <span class="font-semibold text-indigo-700 text-xs">#${idx + 1}</span>
            <button onclick="removeRow(${idx})" class="text-red-500 text-xs hover:underline">നീക്കം ചെയ്യുക</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-slate-500 block">സ്റ്റോക്ക് നമ്പർ</label>
              <input type="text" value="${row.stock_no || ''}" onchange="updateField(${idx}, 'stock_no', this.value)" class="w-full border rounded px-2 py-1 text-sm font-medium" />
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block">വില (₹)</label>
              <input type="text" value="${row.price || ''}" onchange="updateField(${idx}, 'price', this.value)" class="w-full border rounded px-2 py-1 text-sm" />
            </div>
          </div>
          <div>
            <label class="text-[11px] text-slate-500 block font-semibold text-slate-700">പുസ്തകത്തിന്റെ പേര് (Title)</label>
            <input type="text" value="${row.book_title || ''}" onchange="updateField(${idx}, 'book_title', this.value)" class="w-full border rounded px-2 py-1.5 text-sm font-medium border-indigo-200" />
          </div>
          <div>
            <label class="text-[11px] text-slate-500 block">ഗ്രന്ഥകർത്താവ് / പ്രസാധകൻ</label>
            <input type="text" value="${row.author_publisher || ''}" onchange="updateField(${idx}, 'author_publisher', this.value)" class="w-full border rounded px-2 py-1 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-slate-500 block">വിഭാഗം</label>
              <input type="text" value="${row.category || ''}" onchange="updateField(${idx}, 'category', this.value)" class="w-full border rounded px-2 py-1 text-xs" />
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block">ക്ലാസിഫിക്കേഷൻ</label>
              <input type="text" value="${row.classification_no || ''}" onchange="updateField(${idx}, 'classification_no', this.value)" class="w-full border rounded px-2 py-1 text-xs" />
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('resultsCard').classList.remove('hidden');
      document.getElementById('footerBar').classList.remove('hidden');
      document.getElementById('rowCountBadge').textContent = `${extractedEntries.length} വരികൾ`;
      document.getElementById('totalItems').textContent = `${extractedEntries.length} പുസ്തകങ്ങൾ കണ്ടെത്തി`;
    }

    function updateField(index, key, val) {
      extractedEntries[index][key] = val;
    }

    function removeRow(index) {
      extractedEntries.splice(index, 1);
      renderRows();
    }

    function addRow() {
      extractedEntries.unshift({
        stock_no: '', book_title: '', author_publisher: '', category: '',
        how_obtained: '', price: '', bill: '', date: '', voucher_posted: '',
        classification_no: '', almirah_no: '', remarks: ''
      });
      renderRows();
    }

    async function downloadExcel() {
      if (!extractedEntries.length) return;
      const res = await fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(extractedEntries)
      });
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Stock_Register_${Date.now()}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
